services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: driveelite-landing:latest
    container_name: driveelite-landing
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3001/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
